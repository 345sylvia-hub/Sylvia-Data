<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永淋企業 應收帳款儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft JhengHei','微軟正黑體',sans-serif; background: #f0f2f8; color: #1a1a2e; min-height: 100vh; }

header { background: #1F4E79; color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 17px; font-weight: 500; letter-spacing: 1px; }
header span { font-size: 12px; opacity: 0.65; }

.container { max-width: 1140px; margin: 0 auto; padding: 24px; }

/* ── 拖拉上傳區 ── */
.upload-zone {
  border: 2px dashed #93B8D8; border-radius: 14px; background: #fff;
  padding: 36px 20px; text-align: center; margin-bottom: 24px;
  cursor: pointer; transition: all .2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: #1F4E79; background: #EBF3FB; }
.upload-zone .icon { font-size: 36px; margin-bottom: 8px; }
.upload-zone p { font-size: 14px; color: #555; margin-bottom: 4px; }
.upload-zone small { font-size: 12px; color: #aaa; }
.upload-zone input { display: none; }
.upload-btn {
  display: inline-block; margin-top: 12px; padding: 8px 24px;
  background: #1F4E79; color: #fff; border-radius: 8px; font-size: 13px; cursor: pointer;
  font-family: inherit; border: none;
}
.file-loaded { font-size: 13px; color: #1D9E75; font-weight: 600; margin-top: 8px; }

/* ── 月份選擇 ── */
.month-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.pill {
  padding: 5px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
  border: 1px solid #d0d5e8; background: #fff; color: #555;
  font-family: inherit; transition: all .15s;
}
.pill:hover { border-color: #1F4E79; color: #1F4E79; }
.pill.active { background: #1F4E79; color: #fff; border-color: #1F4E79; }
.pill-label { font-size: 12px; color: #888; margin-right: 4px; }

/* ── 指標卡 ── */
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 12px; margin-bottom: 22px; }
.metric-card { background: #fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #e4e7f0; }
.metric-card.hl { border: 2px solid #1F4E79; }
.metric-label { font-size: 11px; color: #999; margin-bottom: 5px; }
.metric-value { font-size: 19px; font-weight: 700; color: #1F4E79; }
.metric-sub { font-size: 11px; color: #bbb; margin-top: 3px; }

/* ── Tab ── */
.tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.tab-btn {
  background: #fff; border: 1px solid #dde0ea; border-radius: 8px;
  padding: 6px 16px; font-size: 13px; cursor: pointer; color: #555;
  font-family: inherit; transition: all .15s;
}
.tab-btn.active { background: #1F4E79; color: #fff; border-color: #1F4E79; }

/* ── 圖表 ── */
.panel { background: #fff; border-radius: 12px; border: 1px solid #e4e7f0; padding: 20px; margin-bottom: 18px; }
.chart-wrap { position: relative; width: 100%; height: 270px; }
.legend { display: flex; gap: 18px; margin-bottom: 12px; font-size: 12px; color: #666; }
.legend span { display: flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ── Top 排名 ── */
.bar-row { display: grid; grid-template-columns: 22px 88px 1fr 120px; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #f0f1f6; font-size: 13px; }
.bar-bg { background: #e8eaf2; border-radius: 3px; height: 7px; }
.bar-fill { background: linear-gradient(90deg,#1F4E79,#378ADD); border-radius: 3px; height: 7px; transition: width .4s; }

/* ── 客戶表格 ── */
.table-panel { background: #fff; border-radius: 12px; border: 1px solid #e4e7f0; overflow: hidden; }
.search-wrap { padding: 10px 14px; border-bottom: 1px solid #f0f1f6; }
.search-wrap input { width: 100%; border: 1px solid #dde0ea; border-radius: 8px; padding: 7px 11px; font-size: 13px; font-family: inherit; }
.search-wrap input:focus { outline: 2px solid #1F4E79; border-color: #1F4E79; }
.t-head { display: grid; gap: 6px; padding: 8px 14px; background: #f7f8fc; font-size: 11px; color: #999; font-weight: 600; border-bottom: 1px solid #eee; }
.t-row { display: grid; gap: 6px; padding: 8px 14px; font-size: 13px; border-bottom: 1px solid #f4f4f8; align-items: center; }
.t-row:hover { background: #f5f7fb; }
.t-right { text-align: right; }

/* ── 空狀態 ── */
.empty { text-align: center; padding: 48px 20px; color: #bbb; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 10px; }

footer { text-align: center; padding: 20px; font-size: 11px; color: #c0c4d0; }
</style>
</head>
<body>

<header>
  <h1>永淋企業有限公司 ─ 應收帳款儀表板</h1>
  <span id="headerPeriod">尚未載入資料</span>
</header>

<div class="container">

  <!-- 上傳區 -->
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
    ondragover="ev(event,'drag',true)" ondragleave="ev(event,'drag',false)" ondrop="onDrop(event)">
    <div class="icon">📂</div>
    <p>將 Excel 檔案拖放至此，或點擊選擇檔案</p>
    <small>支援 .xlsx 格式｜欄位：客戶、1月、稅金、2月、稅金…</small>
    <br>
    <button class="upload-btn" onclick="event.stopPropagation();document.getElementById('fileInput').click()">選擇 Excel 檔案</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="onFile(this.files[0])">
    <div class="file-loaded" id="fileLoaded"></div>
  </div>

  <!-- 月份 pills -->
  <div class="month-pills" id="monthPills" style="display:none">
    <span class="pill-label">顯示月份：</span>
    <button class="pill active" data-m="all" onclick="setMonth(this)">全部</button>
  </div>

  <!-- 指標卡 -->
  <div class="metrics" id="metricsRow" style="display:none"></div>

  <!-- Tab -->
  <div class="tabs" id="tabBar" style="display:none">
    <button class="tab-btn active" onclick="switchTab('trend')">月份趨勢</button>
    <button class="tab-btn" onclick="switchTab('tax')">稅金分析</button>
    <button class="tab-btn" onclick="switchTab('top')">客戶排名 Top10</button>
  </div>

  <div class="panel" id="tab-trend" style="display:none">
    <div class="legend">
      <span><span class="dot" style="background:#378ADD"></span>應收帳款</span>
      <span><span class="dot" style="background:#1D9E75"></span>稅金</span>
    </div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="panel" id="tab-tax" style="display:none">
    <div class="chart-wrap"><canvas id="taxChart"></canvas></div>
  </div>

  <div class="panel" id="tab-top" style="display:none">
    <div style="font-size:13px;color:#999;margin-bottom:10px">Q1 應收帳款合計 Top 10</div>
    <div id="topList"></div>
  </div>

  <!-- 客戶表格 -->
  <div class="table-panel" id="tablePanel" style="display:none">
    <div class="search-wrap"><input id="searchBox" placeholder="搜尋客戶名稱…" oninput="renderTable()"></div>
    <div class="t-head" id="tHead"></div>
    <div id="tableBody"></div>
  </div>

  <div id="emptyState">
    <div class="empty"><div class="big">📊</div>請先匯入 Excel 檔案以顯示儀表板</div>
  </div>

</div>

<footer>永淋企業有限公司 ─ 應收帳款管理系統 ─ 拖入新 Excel 即可更新資料</footer>

<script>
// ── 全域狀態 ──
let DATA = [];        // [{name, months:[{label,amt,tax},...]}]
let MONTHS = [];      // ['1月','2月',...]
let currentMonth = 'all';
let trendInst, taxInst;

// ── 拖放 ──
function ev(e, cls, add){ e.preventDefault(); document.getElementById('dropZone').classList.toggle(cls, add); }
function onDrop(e){ e.preventDefault(); ev(e,'drag',false); const f=e.dataTransfer.files[0]; if(f) onFile(f); }

// ── 讀取 Excel ──
function onFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:0});
      parseData(json, file.name);
    } catch(err) {
      alert('讀取失敗，請確認檔案格式正確：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── 解析資料 ──
function parseData(json, filename){
  // 找出月份欄位（排除「客戶」「客戶編號」「稅金」）
  const keys = Object.keys(json[0] || {});
  const monthKeys = keys.filter(k => /^\d+月$/.test(k));
  MONTHS = monthKeys;

  DATA = json
    .filter(r => r['客戶'] && String(r['客戶']).trim() !== '')
    .map(r => {
      const months = monthKeys.map((mk, i) => {
        const taxKey = Object.keys(r).filter(k => k.startsWith('稅金'))[i] || null;
        return {
          label: mk,
          amt: Number(r[mk]) || 0,
          tax: taxKey ? (Number(r[taxKey]) || 0) : 0
        };
      });
      return { name: String(r['客戶']).trim(), months };
    })
    .filter(r => r.months.some(m => m.amt > 0));

  // 更新 header 期間
  const activeMths = MONTHS.filter(mk => DATA.some(d => d.months.find(m=>m.label===mk && m.amt>0)));
  document.getElementById('headerPeriod').textContent =
    activeMths.length ? `資料期間：2026/${activeMths[0].replace('月','')} – 2026/${activeMths[activeMths.length-1].replace('月','')}` : '';

  document.getElementById('fileLoaded').textContent = '✓ 已載入：' + filename;
  currentMonth = 'all';
  buildUI();
}

// ── 取得單筆數據依月份篩選 ──
function getAmt(d, mLabel){
  if(mLabel === 'all') return d.months.reduce((s,m)=>s+m.amt,0);
  return (d.months.find(m=>m.label===mLabel)||{amt:0}).amt;
}
function getTax(d, mLabel){
  if(mLabel === 'all') return d.months.reduce((s,m)=>s+m.tax,0);
  return (d.months.find(m=>m.label===mLabel)||{tax:0}).tax;
}

// ── 建立整個 UI ──
function buildUI(){
  buildPills();
  buildMetrics();
  buildCharts();
  renderTable();
  renderTop();

  // 顯示所有區塊
  ['monthPills','metricsRow','tabBar','tablePanel'].forEach(id=>{
    document.getElementById(id).style.display='';
  });
  document.getElementById('emptyState').style.display='none';
  switchTab('trend');
}

// ── 月份 Pills ──
function buildPills(){
  const wrap = document.getElementById('monthPills');
  wrap.innerHTML = '<span class="pill-label">顯示月份：</span>';
  const allBtn = document.createElement('button');
  allBtn.className = 'pill active'; allBtn.dataset.m = 'all'; allBtn.textContent = '全部';
  allBtn.onclick = function(){ setMonth(this); };
  wrap.appendChild(allBtn);

  const activeMths = MONTHS.filter(mk => DATA.some(d => d.months.find(m=>m.label===mk && m.amt>0)));
  activeMths.forEach(mk => {
    const btn = document.createElement('button');
    btn.className = 'pill'; btn.dataset.m = mk; btn.textContent = mk;
    btn.onclick = function(){ setMonth(this); };
    wrap.appendChild(btn);
  });
}

function setMonth(btn){
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentMonth = btn.dataset.m;
  buildMetrics();
  buildCharts();
  renderTable();
  renderTop();
}

// ── 指標卡 ──
function buildMetrics(){
  const activeMths = currentMonth === 'all'
    ? MONTHS.filter(mk => DATA.some(d => d.months.find(m=>m.label===mk && m.amt>0)))
    : [currentMonth];

  const wrap = document.getElementById('metricsRow');
  wrap.innerHTML = '';

  activeMths.forEach(mk => {
    const amt = DATA.reduce((s,d)=>s+(d.months.find(m=>m.label===mk)||{amt:0}).amt,0);
    const tax = DATA.reduce((s,d)=>s+(d.months.find(m=>m.label===mk)||{tax:0}).tax,0);
    wrap.innerHTML += `<div class="metric-card">
      <div class="metric-label">${mk} 應收帳款</div>
      <div class="metric-value">$${amt.toLocaleString()}</div>
      <div class="metric-sub">稅金 $${tax.toLocaleString()}</div>
    </div>`;
  });

  if(currentMonth === 'all' && activeMths.length > 1){
    const totalAmt = DATA.reduce((s,d)=>s+d.months.reduce((ss,m)=>ss+m.amt,0),0);
    const totalTax = DATA.reduce((s,d)=>s+d.months.reduce((ss,m)=>ss+m.tax,0),0);
    wrap.innerHTML += `<div class="metric-card hl">
      <div class="metric-label">全期 總計</div>
      <div class="metric-value">$${totalAmt.toLocaleString()}</div>
      <div class="metric-sub">稅金合計 $${totalTax.toLocaleString()}</div>
    </div>`;
  }
}

// ── 圖表 ──
function buildCharts(){
  if(trendInst) trendInst.destroy();
  if(taxInst) taxInst.destroy();

  const activeMths = MONTHS.filter(mk => DATA.some(d => d.months.find(m=>m.label===mk && m.amt>0)));

  // 月份趨勢
  const amts = activeMths.map(mk => DATA.reduce((s,d)=>s+(d.months.find(m=>m.label===mk)||{amt:0}).amt,0));
  const taxes = activeMths.map(mk => DATA.reduce((s,d)=>s+(d.months.find(m=>m.label===mk)||{tax:0}).tax,0));

  trendInst = new Chart(document.getElementById('trendChart').getContext('2d'),{
    type:'bar',
    data:{
      labels: activeMths,
      datasets:[
        {label:'應收帳款', data:amts, backgroundColor:'#378ADD', borderRadius:5},
        {label:'稅金', data:taxes, backgroundColor:'#1D9E75', borderRadius:5}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{ticks:{callback:v=>'$'+Math.round(v/10000)+'萬'}, grid:{color:'rgba(0,0,0,0.05)'}},
        x:{grid:{display:false}}
      }
    }
  });

  // 稅金圓餅
  const taxColors = ['#378ADD','#1D9E75','#D85A30','#7B61FF','#F5A623','#E91E8C','#00BCD4','#8BC34A','#FF5722','#9C27B0','#FF9800','#607D8B'];
  const taxLabels = activeMths.map((mk,i)=>`${mk} $${taxes[i].toLocaleString()}`);
  taxInst = new Chart(document.getElementById('taxChart').getContext('2d'),{
    type:'doughnut',
    data:{
      labels: taxLabels,
      datasets:[{data:taxes, backgroundColor:taxColors.slice(0,taxes.length), borderWidth:0, hoverOffset:8}]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{font:{size:12}, boxWidth:12, padding:16}}}
    }
  });
}

// ── Tab 切換 ──
function switchTab(t){
  ['trend','tax','top'].forEach(id=>{
    document.getElementById('tab-'+id).style.display = id===t ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', ['trend','tax','top'][i]===t);
  });
}

// ── 客戶排名 Top 10 ──
function renderTop(){
  const sorted = [...DATA].sort((a,b)=>getAmt(b,'all')-getAmt(a,'all')).slice(0,10);
  const max = getAmt(sorted[0],'all');
  document.getElementById('topList').innerHTML = sorted.map((d,i)=>`
    <div class="bar-row">
      <span style="color:#ccc;font-weight:700;font-size:12px">${i+1}</span>
      <span style="font-weight:600">${d.name}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(getAmt(d,'all')/max*100)}%"></div></div>
      <span style="text-align:right;font-weight:700;color:#1F4E79">$${getAmt(d,'all').toLocaleString()}</span>
    </div>`).join('');
}

// ── 客戶明細表格 ──
function renderTable(){
  const q = document.getElementById('searchBox').value.trim();
  const activeMths = currentMonth === 'all'
    ? MONTHS.filter(mk => DATA.some(d => d.months.find(m=>m.label===mk && m.amt>0)))
    : [currentMonth];

  const colCount = 1 + activeMths.length + 1; // 客戶 + 各月 + 合計
  const colTemplate = `1fr ${activeMths.map(()=>'100px').join(' ')} 110px`;

  document.getElementById('tHead').style.gridTemplateColumns = colTemplate;
  document.getElementById('tHead').innerHTML =
    `<span>客戶</span>${activeMths.map(mk=>`<span class="t-right">${mk}帳款</span>`).join('')}<span class="t-right">合計</span>`;

  const rows = DATA
    .filter(d => getAmt(d, currentMonth) > 0 && (q==='' || d.name.includes(q)))
    .sort((a,b) => getAmt(b, currentMonth) - getAmt(a, currentMonth));

  document.getElementById('tableBody').innerHTML = rows.map(d => {
    const cells = activeMths.map(mk => {
      const amt = (d.months.find(m=>m.label===mk)||{amt:0}).amt;
      return `<span class="t-right" style="color:${amt>0?'#444':'#ccc'}">${amt>0?'$'+amt.toLocaleString():'—'}</span>`;
    }).join('');
    const tot = getAmt(d,'all');
    return `<div class="t-row" style="grid-template-columns:${colTemplate}">
      <span style="font-weight:600">${d.name}</span>
      ${cells}
      <span class="t-right" style="font-weight:700;color:#1F4E79">$${tot.toLocaleString()}</span>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
