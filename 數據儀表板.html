<script>
// 動態載入 XLSX 和 Chart.js，主要來源失敗時自動切換備用
(function() {
  function loadScript(src, onload, onerror) {
    var s = document.createElement('script');
    s.src = src; s.onload = onload; s.onerror = onerror;
    document.head.appendChild(s);
  }
  
  // 載入 XLSX
  var xlsxUrls = [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
  ];
  var xlsxIdx = 0;
  function tryLoadXLSX() {
    if (xlsxIdx >= xlsxUrls.length) { 
      console.error('XLSX 所有來源載入失敗'); 
      return; 
    }
    loadScript(xlsxUrls[xlsxIdx++], function(){ 
      console.log('XLSX 載入成功');
      tryLoadChart(); // XLSX 成功後載入 Chart.js
    }, tryLoadXLSX);
  }
  
  // 載入 Chart.js
  var chartUrls = [
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
  ];
  var chartIdx = 0;
  function tryLoadChart() {
    if (chartIdx >= chartUrls.length) { 
      console.error('Chart.js 所有來源載入失敗'); 
      return; 
    }
    loadScript(chartUrls[chartIdx++], function(){ 
      console.log('Chart.js 載入成功');
    }, tryLoadChart);
  }
  
  // 開始載入 XLSX
  tryLoadXLSX();
})();
</script>

<script>
// ──────────────────────────────────────────────
// 儲存 Key
// ──────────────────────────────────────────────
const STORAGE_KEY = 'sylvia_ar_data_v1';

// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let STATE = { customers: [], months: [] };
let barChartInst = null;
let lineChartInst = null;

// ──────────────────────────────────────────────
// Toast 通知
// ──────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toastBar');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2800);
}

// ──────────────────────────────────────────────
// LocalStorage 存取
// ──────────────────────────────────────────────
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  } catch(e) {
    console.warn('儲存失敗', e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data && data.customers && data.months && data.months.length > 0) {
      STATE = data;
      return true;
    }
  } catch(e) {}
  return false;
}

// ──────────────────────────────────────────────
// 清除全部資料
// ──────────────────────────────────────────────
function clearAllData() {
  if (!confirm('確定要清除所有儲存的資料嗎？')) return;
  localStorage.removeItem(STORAGE_KEY);
  STATE = { customers: [], months: [] };
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('savedMonthsBar').style.display = 'none';
  document.getElementById('uploadSection').style.display = 'flex';
  document.getElementById('fileInfo').textContent = '尚未載入資料';
  showToast('✅ 資料已清除');
}

// ──────────────────────────────────────────────
// 刪除單一月份
// ──────────────────────────────────────────────
function deleteMonth(month) {
  if (!confirm('確定要刪除 ' + month + ' 的資料嗎？')) return;
  STATE.months = STATE.months.filter(m => m !== month);
  STATE.customers = STATE.customers.map(c => {
    const nc = { ...c };
    delete nc[month];
    delete nc[month + '_tax'];
    return nc;
  }).filter(c => STATE.months.some(m => c[m] > 0));
  if (STATE.months.length === 0) {
    clearAllData();
    return;
  }
  saveToStorage();
  updateMonthTagsBar();
  renderDashboard();
  showToast('🗑 已刪除 ' + month + ' 資料');
}

// ──────────────────────────────────────────────
// 月份標籤列
// ──────────────────────────────────────────────
function updateMonthTagsBar() {
  const bar = document.getElementById('savedMonthsBar');
  const tags = document.getElementById('monthTags');
  if (!STATE.months.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  tags.innerHTML = STATE.months.map(m => `
    <span class="month-tag">
      ${m}
      <span class="month-tag-del" onclick="deleteMonth('${m}')" title="刪除此月份">×</span>
    </span>`).join('');
}

// ──────────────────────────────────────────────
// Drag & drop
// ──────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

// ──────────────────────────────────────────────
// 解析 Excel 並疊加資料
// ──────────────────────────────────────────────
function handleFile(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    alert('Excel 讀取模組尚未載入完成，請等待 2 秒後重新整理頁面再試。');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: null });
      mergeData(raw, file.name);
    } catch(err) {
      alert('讀取失敗，請確認格式。\n' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function mergeData(rows, fileName) {
  if (!rows.length) return;
  const keys = Object.keys(rows[0]);

  const MONTH_KEYS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const TAX_KEYS   = ['稅金','稅金.1','稅金.2','稅金.3','稅金.4','稅金.5','稅金.6','稅金.7','稅金.8','稅金.9','稅金.10','稅金.11'];

  const newMonths = MONTH_KEYS.filter(m => keys.includes(m));
  const dataRows  = rows.filter(r => r['客戶編號'] && r['客戶編號'] !== '合計' && r['客戶']);

  // 新 Excel 裡有哪些月份有資料
  const activeNewMonths = newMonths.filter(m =>
    dataRows.some(r => parseFloat(r[m]) > 0)
  );

  if (!activeNewMonths.length) {
    alert('這份 Excel 沒有找到有效的月份資料');
    return;
  }

  // 用 Map 合併客戶資料（以客戶編號為 key）
  const customerMap = new Map();
  STATE.customers.forEach(c => customerMap.set(c.id, { ...c }));

  dataRows.forEach(r => {
    const id   = String(r['客戶編號'] || '');
    const name = String(r['客戶'] || '');
    if (!id) return;

    if (!customerMap.has(id)) {
      customerMap.set(id, { id, name });
    }
    const obj = customerMap.get(id);

    newMonths.forEach((m, i) => {
      const v = parseFloat(r[m]) || 0;
      const t = parseFloat(r[TAX_KEYS[MONTH_KEYS.indexOf(m)]]) || 0;
      if (v > 0) {
        obj[m] = v;
        obj[m + '_tax'] = t;
      }
    });
  });

  // 合併月份清單（保持順序）
  const allMonths = [...new Set([...STATE.months, ...activeNewMonths])];
  allMonths.sort((a, b) => MONTH_KEYS.indexOf(a) - MONTH_KEYS.indexOf(b));

  // 過濾出有任何月份資料的客戶
  const allCustomers = Array.from(customerMap.values()).filter(c =>
    allMonths.some(m => c[m] > 0)
  );

  // 偵測哪些是新增月份
  const addedMonths = activeNewMonths.filter(m => !STATE.months.includes(m));
  const updatedMonths = activeNewMonths.filter(m => STATE.months.includes(m));

  STATE = { customers: allCustomers, months: allMonths };
  saveToStorage();
  updateMonthTagsBar();

  document.getElementById('fileInfo').textContent = allMonths.join('、') + '　共 ' + allMonths.length + ' 個月';

  let toastMsg = '';
  if (addedMonths.length) toastMsg += '✅ 新增 ' + addedMonths.join('、') + '　';
  if (updatedMonths.length) toastMsg += '🔄 更新 ' + updatedMonths.join('、');
  if (toastMsg) showToast(toastMsg.trim());

  renderDashboard();
  document.getElementById('uploadSection').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

// ──────────────────────────────────────────────
// Render
// ──────────────────────────────────────────────
const COLORS = ['#4f9eff','#36d9a0','#f5a623','#d97bff','#ff6b6b','#4ee6e6','#ffd36b','#ff9f4e','#a8ff78','#fe8ebb'];

function fmt(v)  { return v > 0 ? '$' + v.toLocaleString('zh-TW') : '—'; }
function fmtK(v) { return v >= 10000 ? '$' + Math.round(v/1000) + 'K' : '$' + Math.round(v); }

function renderDashboard() {
  renderKPIs();
  renderBarChart();
  renderLineChart();
  renderTableHead();
  renderTable();
}

function renderKPIs() {
  const { customers, months } = STATE;
  if (!months.length) return;
  const latest = months[months.length - 1];
  const prev   = months.length > 1 ? months[months.length - 2] : null;

  const latestTotal = customers.reduce((s, c) => s + (c[latest] || 0), 0);
  const prevTotal   = prev ? customers.reduce((s, c) => s + (c[prev] || 0), 0) : null;
  const latestTax   = customers.reduce((s, c) => s + (c[latest + '_tax'] || 0), 0);
  const latestCount = customers.filter(c => c[latest] > 0).length;
  const totalAll    = months.reduce((s, m) => s + customers.reduce((ss, c) => ss + (c[m] || 0), 0), 0);

  const change    = prevTotal !== null ? latestTotal - prevTotal : null;
  const changePct = (prevTotal && prevTotal > 0) ? ((change / prevTotal) * 100).toFixed(1) : null;

  const kpis = [
    { label: latest + ' 應收合計', value: '$' + latestTotal.toLocaleString('zh-TW'),
      sub: '稅金 $' + latestTax.toLocaleString('zh-TW') + '　' + latestCount + ' 家客戶',
      badge: null, c1: '#4f9eff', c2: '#36d9a0' },
    { label: prev ? '較 ' + prev + ' 變動' : '月變動',
      value: change !== null ? (change >= 0 ? '+' : '') + '$' + Math.abs(change).toLocaleString('zh-TW') : '—',
      sub: changePct !== null ? (change >= 0 ? '增加' : '減少') + ' ' + Math.abs(changePct) + '%' : '—',
      badge: change !== null ? (change >= 0 ? 'up' : 'dn') : null,
      c1: change >= 0 ? '#36d9a0' : '#ff5f57', c2: change >= 0 ? '#4f9eff' : '#ff9f4e' },
    { label: months[0] + '～' + latest + ' 累計', value: '$' + totalAll.toLocaleString('zh-TW'),
      sub: months.length + ' 個月合計', badge: null, c1: '#f5a623', c2: '#d97bff' },
    { label: latest + ' 有資料客戶', value: String(latestCount),
      sub: '共 ' + customers.length + ' 家客戶', badge: null, c1: '#d97bff', c2: '#fe8ebb' }
  ];

  document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
    <div class="kpi-card" style="--c1:${k.c1};--c2:${k.c2}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
      ${k.badge ? `<div class="kpi-badge badge-${k.badge}">${k.badge === 'up' ? '▲' : '▼'} ${Math.abs(changePct)}%</div>` : ''}
    </div>`).join('');
}

function renderBarChart() {
  const { customers, months } = STATE;
  if (!months.length) return;
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js 尚未載入');
    return;
  }
  
  const latest    = months[months.length - 1];
  const sorted    = [...customers].sort((a, b) => (b[latest]||0) - (a[latest]||0)).slice(0, 10);
  const showMonths = months.slice(-3);

  document.getElementById('barSub').textContent = '依' + latest + '排序，顯示前 10 名';
  document.getElementById('barLegend').innerHTML = showMonths.map((m, i) =>
    `<div class="leg"><div class="leg-dot" style="background:${COLORS[i]}"></div>${m}</div>`
  ).join('');

  if (barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: sorted.map(c => c.name),
      datasets: showMonths.map((m, i) => ({
        label: m, data: sorted.map(c => c[m] || 0),
        backgroundColor: COLORS[i] + 'cc', borderRadius: 4, borderSkipped: false
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8892a4', font: { size: 11 }, maxRotation: 30 }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#8892a4', font: { size: 11, family: 'DM Mono' }, callback: v => fmtK(v) },
             grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false } }
      }
    }
  });
}

function renderLineChart() {
  const { customers, months } = STATE;
  if (!months.length) return;
  if (typeof Chart === 'undefined') {
    console.warn('Chart.js 尚未載入');
    return;
  }
  
  const totals = months.map(m => customers.reduce((s, c) => s + (c[m] || 0), 0));

  if (lineChartInst) lineChartInst.destroy();
  lineChartInst = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: '月合計', data: totals,
        borderColor: '#4f9eff', backgroundColor: 'rgba(79,158,255,0.08)',
        fill: true, tension: 0.35, pointRadius: 5,
        pointBackgroundColor: '#4f9eff', pointBorderColor: '#0f1117', pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ' $' + ctx.raw.toLocaleString('zh-TW') } } },
      scales: {
        x: { ticks: { color: '#8892a4', font: { size: 12 } }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#8892a4', font: { size: 11, family: 'DM Mono' }, callback: v => fmtK(v) },
             grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false } }
      }
    }
  });
}

function renderTableHead() {
  const { months } = STATE;
  const latest = months[months.length - 1];
  const prev   = months.length > 1 ? months[months.length - 2] : null;
  document.getElementById('tableHead').innerHTML = `<tr>
    <th>客戶編號</th><th>客戶</th>
    ${prev ? `<th class="num">${prev}</th>` : ''}
    <th class="num">${latest}</th>
    <th class="num">稅金 (${latest})</th>
    <th class="num">累計</th>
    <th>趨勢</th>
  </tr>`;
}

function renderTable() {
  const { customers, months } = STATE;
  if (!months.length) return;
  const latest = months[months.length - 1];
  const prev   = months.length > 1 ? months[months.length - 2] : null;

  const q      = document.getElementById('searchBox').value.trim().toLowerCase();
  const sort   = document.getElementById('sortSel').value;
  const filter = document.getElementById('filterSel').value;

  let data = customers.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !c.id.toLowerCase().includes(q)) return false;
    if (filter === 'latest')  return c[latest] > 0;
    if (filter === 'new')     return c[latest] > 0 && (!prev || !c[prev]);
    if (filter === 'missing') return !c[latest] && months.some(m => m !== latest && c[m] > 0);
    return true;
  });

  const total = c => months.reduce((s, m) => s + (c[m] || 0), 0);
  if (sort === 'latest_desc') data.sort((a, b) => (b[latest]||0) - (a[latest]||0));
  else if (sort === 'total_desc') data.sort((a, b) => total(b) - total(a));
  else data.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));

  function badge(c) {
    if (!prev) return '';
    if (c[latest] > 0 && !c[prev]) return '<span class="pill pill-new">新增</span>';
    if (!c[latest] && c[prev] > 0) return '<span class="pill pill-na">本月無</span>';
    if (c[latest] > 0 && c[prev] > 0) {
      const pct = ((c[latest] - c[prev]) / c[prev] * 100).toFixed(0);
      return c[latest] >= c[prev]
        ? `<span class="pill pill-up">▲ ${pct}%</span>`
        : `<span class="pill pill-dn">▼ ${Math.abs(pct)}%</span>`;
    }
    return '';
  }

  document.getElementById('tableBody').innerHTML = data.map(c => `<tr>
    <td class="dim">${c.id}</td>
    <td style="font-weight:500">${c.name}</td>
    ${prev ? `<td class="num" style="color:var(--text2)">${fmt(c[prev]||0)}</td>` : ''}
    <td class="num" style="color:${c[latest]>0?'var(--text)':'var(--text3)'}">${fmt(c[latest]||0)}</td>
    <td class="num" style="color:var(--text2)">${fmt(c[latest+'_tax']||0)}</td>
    <td class="num" style="font-weight:500">${fmt(total(c))}</td>
    <td>${badge(c)}</td>
  </tr>`).join('');

  document.getElementById('tableFooter').textContent = `顯示 ${data.length} 筆 / 共 ${customers.length} 筆`;
}

// ──────────────────────────────────────────────
// 頁面載入：自動讀取儲存資料
// ──────────────────────────────────────────────
window.addEventListener('load', () => {
  const hasSaved = loadFromStorage();
  if (hasSaved) {
    document.getElementById('fileInfo').textContent =
      STATE.months.join('、') + '　共 ' + STATE.months.length + ' 個月';
    updateMonthTagsBar();
    renderDashboard();
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }
});
</script>
